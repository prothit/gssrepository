
<!DOCTYPE html>
<html lang="en">
<head>
  <title>GSS CORPORATION</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
  
  <style>
  #logoimg{
   width:50px;
   height:50px;
  }
  nav a:hover{
  cursor:pointer;
  background-color:yellow;
  }
  .grid-container{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(300px,1fr));
  padding:10px;
  grid-gap:10px;
  overflow:auto;
}
.grid-container>div{
 text-align:center;
 padding:5px;
 font-size:30px;
 font-weight:bold;
 overflow:auto;
}

.grid-container>div:hover{
  background-color:yellow;
}
  </style>
  
 <script>
    // 1. Initialize the AngularJS Application
    var app = angular.module('myApp', []);

    // 2. Define the missing controller and inject $scope
    app.controller('myCtrl', function($scope) {
        
        // 3. Attach the array to $scope so ng-repeat can see it
        $scope.pathlist = [
            './images/poles1.jpg','./images/poles2.jpg','./images/poles3.jpg', 
            './images/poles4.jpg','./images/poles5.jpg','./images/poles6.jpg', 
            './images/poles7.jpg','./images/poles8.jpg','./images/poles9.jpg',
            './images/poles10.jpg','./images/poles11.jpg','./images/poles12.jpg',
            './images/poles13.jpg','./images/poles14.jpg','./images/poles15.jpg', 
            './images/poles16.jpg','./images/poles17.jpg','./images/poles18.jpg',
            './images/poles19.jpg','./images/poles20.jpg'
        ];
    });
</script>

</head>
<body ng-app="myApp" ng-controller="myCtrl">

<nav class="navbar navbar-expand-sm bg-dark navbar-dark bg-opacity-50 p-0">
  <div class="container-fluid px-3">
    <!-- 1. Brand Logo (Always visible) -->
    <a class="navbar-brand" href="./gss.html">
      <img id="logoimg" src="./images/logo.jpg" alt="Gss Corporation Logo">
    </a>

    <!-- 2. Hamburger Button (Only visible on small screens) -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- 3. Collapsible Links Container -->
    <div class="collapse navbar-collapse" id="mynavbar">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <!-- Using 'nav-link' makes it style beautifully on all screen sizes -->
          <a class="nav-link fw-bold text-light" href="./aboutus.html">ABOUT US</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

 <div id="main" class="container-fluid bg-dark bg-opacity-25 mt-3 p-5" >
  <h3 >FUNCTIONALITIES OF GSS CORPORATION</h3>
     <h3>1.Supply of Poles and Telecom Optical fibre, Patch Cord, SFP, Router, ONU and Data transfer Items in major brands.</h3>
     <h3>2.Supply of all type CCTV Camera and All accessories NVR , DVR Connector Etc.</h3>
 </div>
 <div class="text-white bg-dark fw-bold text-center">Our Products:: </div>
 <div class="grid-container mt-3 bg-dark bg-opacity-25 ">
 
  <div class="bg-opacity-25" ng-repeat="path in pathlist"><img class="img-fluid" ng-src="{{path}}" alt="Product image"></div>
</div>


</body>
</html>
